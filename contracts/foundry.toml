[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["../node_modules", "lib"]
allow_paths = ["../node_modules"]
fs_permissions = [{ access = "read", path = "./test/fixtures" }]
remappings = [
  "@gluwa/asc-contracts/=../node_modules/@gluwa/asc-contracts/",
  "@openzeppelin/=../node_modules/@openzeppelin/",
  "forge-std/=lib/forge-std/src/",
]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "shanghai"

[lint]
lint_on_build = false
# `arbitrary-send-eth` fires on `PegGuard._pay`, which is the product: a claim pays the policy
# holder and a withdrawal pays an LP, both addresses chosen by whoever bought or deposited. The
# destination is never caller-supplied at call time — it is read from storage written at purchase
# or deposit — and every payer is `nonReentrant` with effects before the transfer. Excluded here so
# that CI can gate on "no high-severity findings" and mean it (see .github/workflows/ci.yml).
exclude_lints = ["arbitrary-send-eth"]
